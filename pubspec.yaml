name: word_puzzle_match
description: "Word Puzzle Match — A fun family-friendly word search puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.1

  # Navigation
  go_router: ^14.2.7

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Audio
  audioplayers: ^6.1.0

  # Utils
  path_provider: ^2.1.3
  collection: ^1.18.0
  http: ^1.2.1
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3
  device_info_plus: ^10.1.0
  url_launcher: ^6.3.0

  # Ads
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/images/
    - assets/animations/
    - assets/audio/



