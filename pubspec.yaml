name: word_puzzle_match
description: "Word Puzzle Match — A fun family-friendly word search puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.1

  # Navigation
  go_router: ^14.2.7

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Audio
  audioplayers: ^6.1.0

  # Utils
  path_provider: ^2.1.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/images/
    - assets/animations/
    - assets/audio/


